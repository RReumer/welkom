<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basis</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<style>
  :root{
    --ink:#ffffff;
    --ink-soft:rgba(255,255,255,.8);
    --pulse:#16C9E0;
    --radius:22px;
    --font:Arial, Helvetica, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent}
  body{font-family:var(--font);color:var(--ink);overflow:hidden}

  .stage{position:relative;height:100%;min-height:300px;border-radius:var(--radius);overflow:hidden;background:#0E2A30}
  #map{position:absolute;inset:0}

  /* zachte rand zodat tekst leesbaar blijft op elke kaartkleur */
  .shade{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(14,42,48,0) 70%,rgba(14,42,48,.35) 100%)}

  .label{position:absolute;left:18px;bottom:14px;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.4)}
  .label p{font-size:13px;color:var(--ink-soft)}

  /* pulserende stip: klein en rustig */
  .base{position:relative;width:12px;height:12px}
  .base i{position:absolute;inset:0;border-radius:50%;background:var(--pulse);box-shadow:0 0 10px var(--pulse)}
  .base b{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--pulse);animation:ripple 3.2s ease-out infinite}
  .base b:nth-child(3){animation-delay:1.6s}
  @keyframes ripple{from{transform:scale(1);opacity:.7}to{transform:scale(4);opacity:0}}

  .maplibregl-ctrl-attrib{font-family:var(--font);font-size:10px}
  .maplibregl-ctrl-attrib.maplibregl-compact{background:rgba(255,255,255,.7)}

  .note{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink-soft);font-size:14px}

  @media (prefers-reduced-motion:reduce){ .base b{animation:none;opacity:0} }
</style>
</head>
<body>
<div class="stage">
  <div id="map" role="img" aria-label="3D-kaart van IJsselmuiden en Kampen"></div>
  <div class="shade" aria-hidden="true"></div>
  <div class="label">
    <p>IJsselmuiden &amp; Kampen</p>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script>
(() => {
  // ---------- Instellingen ----------
  const BASE    = [5.919, 52.559];      // tussen IJsselmuiden en Kampen (bij de IJssel)
  const START   = [5.30, 52.20];        // boven Nederland
  const ZOOM    = 14.4;
  const PITCH   = 62;
  const SPIN    = 2;                    // graden per seconde: één rondje in 3 minuten
  const IDLE_MS = 8000;                 // na zoveel ms stilstand weer gaan draaien
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const STYLES  = {
    day:   "https://tiles.openfreemap.org/styles/liberty",
    night: "https://tiles.openfreemap.org/styles/dark"
  };

  if (!window.maplibregl) {
    document.querySelector(".stage").insertAdjacentHTML("beforeend",
      '<p class="note">De kaart kon niet laden. Ververs de pagina om het opnieuw te proberen.</p>');
    return;
  }

  // ---------- Dag of nacht: zonnestand voor Kampen ----------
  function sunElevation(date, lat, lon) {
    const rad = Math.PI / 180;
    const day = Math.floor((date - Date.UTC(date.getUTCFullYear(), 0, 0)) / 864e5);
    const hour = date.getUTCHours() + date.getUTCMinutes() / 60;
    const g = 2 * Math.PI / 365 * (day - 1 + (hour - 12) / 24);
    const decl = 0.006918 - 0.399912*Math.cos(g) + 0.070257*Math.sin(g) - 0.006758*Math.cos(2*g)
               + 0.000907*Math.sin(2*g) - 0.002697*Math.cos(3*g) + 0.00148*Math.sin(3*g);
    const eqt = 229.18 * (0.000075 + 0.001868*Math.cos(g) - 0.032077*Math.sin(g) - 0.014615*Math.cos(2*g) - 0.040849*Math.sin(2*g));
    const tst = hour * 60 + eqt + 4 * lon;
    const ha = (tst / 4 - 180) * rad;
    const cosZ = Math.sin(lat*rad)*Math.sin(decl) + Math.cos(lat*rad)*Math.cos(decl)*Math.cos(ha);
    return 90 - Math.acos(Math.max(-1, Math.min(1, cosZ))) / rad;
  }
  const mode = () => sunElevation(new Date(), BASE[1], BASE[0]) > -4 ? "day" : "night";
  let current = mode();

  // ---------- Kaart ----------
  const map = new maplibregl.Map({
    container: "map",
    style: STYLES[current],
    center: REDUCED ? BASE : START,
    zoom: REDUCED ? ZOOM : 6.4,
    pitch: REDUCED ? PITCH : 0,
    bearing: REDUCED ? -20 : 0,
    maxPitch: 75,
    attributionControl: {compact: true},
    cooperativeGestures: false
  });
  map.scrollZoom.disable();             // scrollen = SharePoint-pagina scrollen
  map.touchZoomRotate.disableRotation();

  // als de donkere stijl niet laadt: terugvallen op de lichte
  map.on("error", e => {
    if (current === "night" && String(e && e.error && e.error.message || "").match(/style|404|Failed/i)) {
      current = "day"; map.setStyle(STYLES.day);
    }
  });

  // ---------- 3D-gebouwen en lucht ----------
  function decorate() {
    const night = current === "night";
    try {
      map.setSky({
        "sky-color":     night ? "#0E2A30" : "#16C9E0",
        "horizon-color": night ? "#123A42" : "#D6F6FB",
        "fog-color":     night ? "#0E2A30" : "#EEF8FA",
        "sky-horizon-blend": .6, "horizon-fog-blend": .5, "fog-ground-blend": .4
      });
    } catch (e) {}

    const style = map.getStyle();
    const srcId = Object.keys(style.sources).find(k => style.sources[k].type === "vector");
    if (!srcId) return;
    // bestaande 3D-laag van de stijl gebruiken, anders zelf toevoegen
    const existing = style.layers.find(l => l.type === "fill-extrusion");
    if (existing) {
      map.setPaintProperty(existing.id, "fill-extrusion-color", night ? "#16414A" : "#E4ECEE");
      map.setPaintProperty(existing.id, "fill-extrusion-opacity", night ? .9 : .85);
      return;
    }
    const firstLabel = style.layers.find(l => l.type === "symbol");
    map.addLayer({
      id: "gebouwen-3d", type: "fill-extrusion", source: srcId, "source-layer": "building", minzoom: 13,
      paint: {
        "fill-extrusion-color": night ? "#16414A" : "#E4ECEE",
        "fill-extrusion-height": ["interpolate", ["linear"], ["zoom"], 13, 0, 14.5, ["coalesce", ["get", "render_height"], 6]],
        "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
        "fill-extrusion-opacity": night ? .9 : .85
      }
    }, firstLabel && firstLabel.id);
  }
  map.on("style.load", decorate);

  // ---------- Pulserende stip ----------
  const el = document.createElement("div");
  el.className = "base";
  el.innerHTML = "<i></i><b></b><b></b>";
  el.setAttribute("aria-hidden", "true");
  new maplibregl.Marker({element: el}).setLngLat(BASE).addTo(map);

  // ---------- Intro-vlucht en rondjes draaien ----------
  let spinning = false, lastInteract = 0, lastFrame = 0;
  function spin(ts) {
    if (!spinning) return;
    const dt = lastFrame ? (ts - lastFrame) / 1000 : 0;
    lastFrame = ts;
    if (Date.now() - lastInteract > IDLE_MS && !map.isMoving()) {
      map.setBearing(map.getBearing() + SPIN * dt);
    }
    requestAnimationFrame(spin);
  }
  function startSpin() {
    if (REDUCED || spinning) return;
    spinning = true; lastFrame = 0; requestAnimationFrame(spin);
  }

  ["mousedown", "mouseup", "touchstart", "touchend", "wheel"].forEach(ev =>
    map.getCanvas().addEventListener(ev, () => { lastInteract = Date.now(); }, {passive: true}));
  map.on("dragend", () => { lastInteract = Date.now(); });

  map.once("load", () => {
    if (REDUCED) return;
    setTimeout(() => {
      map.flyTo({center: BASE, zoom: ZOOM, pitch: PITCH, bearing: -20, duration: 7000, curve: 1.6, essential: true});
      map.once("moveend", startSpin);
    }, 600);
  });

  // ---------- Elk kwartier: dag/nacht bijwerken ----------
  setInterval(() => {
    const m = mode();
    if (m !== current) { current = m; map.setStyle(STYLES[m]); }
  }, 15 * 60e3);
})();
</script>
</body>
</html>
